<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LunchCall{% endblock %}</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', path='/lunchcall-logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
  <script defer src="{{ url_for('static', path='/app.js') }}"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  {% if admin %}
  <header class="site-header">
    <a class="brand" href="/">
      <img class="brand-logo" src="{{ url_for('static', path='/lunchcall-logo.png') }}" alt="" width="42" height="42">
      <span>LunchCall</span>
    </a>
    <nav>
      <a class="{{ 'active' if request.url.path == '/' else '' }}" href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>오늘의 식수</a>
      <a class="{{ 'active' if request.url.path.startswith('/employees') else '' }}" href="/employees" {% if request.url.path.startswith('/employees') %}aria-current="page"{% endif %}>직원 관리</a>
      <a class="{{ 'active' if request.url.path.startswith('/history') else '' }}" href="/history" {% if request.url.path.startswith('/history') %}aria-current="page"{% endif %}>확정 이력</a>
    </nav>
    <div class="account">
      <a class="account-link {{ 'active' if request.url.path.startswith('/settings') else '' }}" href="/settings" {% if request.url.path.startswith('/settings') %}aria-current="page"{% endif %}>설정</a>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="text-button" type="submit">로그아웃</button>
      </form>
    </div>
  </header>
  {% endif %}

  <main id="main-content" class="{% block main_class %}page-shell{% endblock %}" tabindex="-1">
    {% if message %}<div class="toast success" role="status">{{ message }}</div>{% endif %}
    {% if error %}<div class="toast error" role="alert">{{ error }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
